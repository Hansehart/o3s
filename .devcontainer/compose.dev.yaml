# NAME
#        compose.dev.yaml — development overlay running a second o3s stack from this checkout
#
# DESCRIPTION
#        Remaps every name, network and address the stack claims and builds the gateway
#        and base images from this checkout's Dockerfiles, so the o3s under development
#        runs beside the o3s in daily use.
#
# USAGE
#        Name this file after compose.yaml in devcontainer.json's dockerComposeFile and hand
#        its gateway address to the docker-in-docker feature as DNS, then run the Dev Containers
#        extension command "Dev Containers: Rebuild and Reopen in Container".
#
# SEE ALSO
#        compose.yaml, devcontainer.json

# Stack name, so volumes land under o3s-dev_* and stay separate
name: o3s-dev

# Cage network identity, a subnet away from the daily stack
x-cage-subnet: &cage_subnet 10.11.0.0/24
x-gateway-ip: &gateway_ip 10.11.0.2

services:
  cage:
    # Build the base image from this checkout, which Dev Containers then layers features onto
    build:
      context: ../images/base
    image: o3s-base:dev
    pull_policy: build
    environment:
      GATEWAY_IP: *gateway_ip
    # Replace the inherited list, so resolv.conf holds this stack's gateway alone
    dns: !override
      - *gateway_ip

  gateway:
    # Build the gateway from this checkout
    build:
      context: ../images/gateway
    image: o3s-gateway:dev
    pull_policy: build
    environment:
      GW_CAGE_IP: *gateway_ip
    networks:
      cage:
        ipv4_address: *gateway_ip
      egress:

  proxy:
    # Replace the inherited argv, so the proxy listens on this stack's gateway alone
    command: !override
      - --mode
      - transparent
      - --showhost
      - --set
      - connection_strategy=lazy
      - --set
      - block_global=false
      - --set
      - onboarding=false
      - --set
      - body_size_limit=100m
      - --set
      - confdir=/config
      - --listen-host
      - *gateway_ip
      - --listen-port
      - "8443"
      - -s
      - /addons/inject.py

networks:
  cage:
    name: o3s-dev-cage
    ipam:
      config:
        - subnet: *cage_subnet
  egress:
    name: o3s-dev-egress
