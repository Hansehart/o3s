# Stack name
name: o3s

# Cage network identity
x-cage-subnet: &cage_subnet 10.10.0.0/24
x-gateway-ip: &gateway_ip 10.10.0.2

# Apps deployed by stack
services:
  # Sole path to the internet for the dev container.
  gateway:
    image: ghcr.io/hansehart/o3s-gateway:latest
    pull_policy: always
    container_name: o3s-gateway
    # Required to manage iptables/ipset and route/NAT the cage network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Deny privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Forward IPv4 between the cage and egress interfaces so the gateway can route and NAT the cage out
    sysctls:
      - net.ipv4.ip_forward=1
    # Cage identity: the gateway locates its cage/egress interfaces from this
    environment:
      GW_CAGE_IP: *gateway_ip
    # The allow-listed hosts
    volumes:
      - ./config.toml:/config/config.toml:ro
    networks:
      cage:
        ipv4_address: *gateway_ip
      egress:
    restart: unless-stopped
    healthcheck:
      # Resolve an allow-listed host through dnsmasq and open a real connection
      test: ["CMD", "healthcheck.sh"]
      # Probe fast during startup so the dev container's service_healthy gate clears in seconds
      # Once healthy, re-check rarely
      start_interval: 3s
      start_period: 30s
      interval: 10m
      timeout: 5s
      retries: 3

  # Injects the upstream API key into inject-host HTTPS so the keys live here, never in the cage.
  proxy:
    image: ghcr.io/mitmproxy/mitmproxy:12.2.3@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    pull_policy: missing
    container_name: o3s-proxy
    # Share the gateway's network namespace so its iptables REDIRECT lands here and resolves the original dst
    network_mode: "service:gateway"
    # Deny privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Run mitmdump as this host's user
    entrypoint: ["mitmdump"]
    user: ${O3S_UID}:${O3S_GID}
    # Reach the mounted secrets by file permission alone
    cap_drop:
      - ALL
    environment:
      # The marker the addon swaps for real secrets
      O3S_MARKER: ${O3S_MARKER}
    volumes:
      # Signing CA, DH parameters and the real tokens
      - ${HOME}/.config/o3s:/config:ro
      # Which hosts are allowed and which of them inject which secret
      - ./config.toml:/etc/o3s/config.toml:ro
      # Injection logic (not secret)
      - ./proxy/inject.py:/addons/inject.py:ro
    # Take the redirected cage HTTPS, holding each connection until the handshake names its host
    command: >
      --mode transparent --showhost
      --set connection_strategy=lazy
      --set block_global=false
      --set onboarding=false
      --set body_size_limit=100m
      --set confdir=/config
      --listen-host 10.10.0.2 --listen-port 8443
      -s /addons/inject.py
    restart: unless-stopped
    # Shares the gateway's network namespace, so it must start after the gateway and restart with it.
    depends_on:
      gateway:
        condition: service_healthy

  o3s:
    image: ghcr.io/hansehart/o3s-base:latest
    # Dev Containers rebuilds this into a local vsc-o3s-<hash> image so only pull the base when absent
    pull_policy: missing
    container_name: o3s
    environment:
      # Egress firewall gateway
      GATEWAY_IP: *gateway_ip
    env_file: .env
    volumes:
      # Host mount for dynamic changes
      - ../:/home/ubuntu/o3s:ro
      # Persistent state for installed features
      - features:/home/ubuntu/features
      # Volume mount for project to work with across sessions
      - projects:/home/ubuntu/projects
      # Public proxy CA, folded into the trust store
      - ${HOME}/.config/o3s/mitmproxy-ca.crt:/usr/local/share/ca-certificates/mitmproxy-ca.crt:ro
    # Limit ressource usage
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: 4
        #reservations:
        #  devices:
        #    - driver: nvidia
        #      count: all
        #      capabilities: [gpu]
    # Required by Docker-in-Docker
    cap_add:
      - NET_ADMIN
    # Deny privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Bring the cage up behind the gateway
    command: bash /home/ubuntu/o3s/.devcontainer/cage/start.sh
    # Its sole exit is the gateway
    networks:
      - cage
    # Wait until the gateway is routing before this container starts
    depends_on:
      gateway:
        condition: service_healthy
    # Resolve through the gateway's dnsmasq
    dns:
      - *gateway_ip

networks:
  # Only the gateway (which NATs via its own egress interface) can reach the internet
  cage:
    name: o3s-cage
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: *cage_subnet
  # Gateway's own path to the internet
  egress:
    name: o3s-egress

volumes:
  features:
  projects:
