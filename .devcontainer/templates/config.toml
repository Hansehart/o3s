# NAME
#        config.toml — o3s egress allowlist and credential injection
#
# SYNOPSIS
#        ["host"]
#        ports  = [PORT, ...]
#        secret = "NAME"          # optional
#
# DESCRIPTION
#        Each table is one host the gateway permits; everything else is default-denied. A
#        host may be a domain (subdomains covered), an IPv4 host, or an IPv4 CIDR block.
#
#        ports   Required. TCP port(s) allowed to the host.
#        secret  Optional. Marks a credential-inject host: the gateway routes its HTTPS
#                through the proxy, which swaps the o3s marker for this secret's token (from
#                ~/.config/o3s/secrets.env).
#
# EXAMPLES
#        ["github.com"]
#        ports = [22, 443]
#
#        ["api.openai.com"]
#        ports  = [443]
#        secret = "OPENAI_API_KEY"
#
#        ["10.8.0.0/24"]
#        ports = [443]
#
# NOTES
#        Edits take effect after: docker restart o3s-gateway o3s-mitm  (restart both due to shared network namespace)

# Git hosting
["ghcr.io"]
ports = [443]
["github.com"]
